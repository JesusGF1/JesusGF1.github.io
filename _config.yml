title: "The Brainformatician"
author: "Jesus Gonzalez Ferrer"
description: "Jesus Gonzalez Ferrer — PhD candidate in Bioinformatics & Bioengineering at UC Santa Cruz. Genomics, neuroscience and deep learning."
url: "https://jesusgf1.github.io"

# Used for link previews (Open Graph / Twitter cards).
# jekyll-seo-tag reads `image` per page, not site-wide, so the default is
# applied to every page via `defaults` at the bottom of this file.
twitter:
  username: Brainformatics
  card: summary_large_image

# Email / Social media user names used by the minima theme:
# All of these are optional and can be removed or commented out
email: "brainformatician@gmail.com"
twitter_username: "Brainformatics"
github_username: "JesusGF1"
#linkedin_username: "username"
#facebook_username: username
#flickr_username: username
#instagram_username: username
#pinterest_username: username
#youtube_username: username
#googleplus_username: +username

#########################################################################################
######### Nothing below needs to be changed (unless you know what you're doing) #########
#########################################################################################
theme: "minima"

rss: rss

kramdown:
  syntax_highlighter_opts:
    disable: true
    
plugins:
  - jekyll-feed
  - jekyll-sitemap

titles_from_headings:
  strip_title: true
  collections: true

defaults:
  - scope:
      path: ""
    values:
      image: /images/Foto_jesus.jpeg
  - scope:
      path: ""
      type: post
    values:
      tags: Other
